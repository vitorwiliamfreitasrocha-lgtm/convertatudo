<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Remova o fundo de imagens gratuitamente com IA, direto no navegador. Sem upload para servidores."/>
  <title>Remover Fundo de Imagem — ConverTaTudo</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2791552825636590" crossorigin="anonymous"></script>
  <style>
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .compare-box { text-align: center; }
    .compare-box canvas, .compare-box img { width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border); background: repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 0 0 / 16px 16px; }
    .compare-label { font-size: 0.8rem; color: var(--text-secondary); margin-top: 6px; }
    .info-box { background:#EFF6FF;border:1px solid #BFDBFE;border-radius:var(--radius-sm);padding:12px 16px;font-size:0.85rem;color:#1E40AF; }
    .info-box.success { background:#DCFCE7;border-color:#86EFAC;color:#166534; }
    .info-box.error { background:#FEF2F2;border-color:#FECACA;color:#991B1B; }
    .model-bar-wrap { height:4px; background:#BFDBFE; border-radius:2px; margin-top:8px; overflow:hidden; }
    .model-bar { height:100%; background:#1E40AF; border-radius:2px; width:0%; transition:width .3s ease; }
    @media(max-width:500px){.compare-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>
  <main>
    <div class="tool-page">
      <div class="container">
        <div class="tool-header">
          <a class="tool-header-back" href="../index.html" data-i18n="ui.back"></a>
          <h1>✂️ <span id="title"></span></h1>
          <p id="subtitle"></p>
        </div>

        <div class="tool-layout">
          <div class="tool-main">

            <div class="info-box mb-4" id="model-notice">
              ⏳ <span id="model-notice-text"></span>
              <div class="model-bar-wrap"><div class="model-bar" id="model-bar"></div></div>
            </div>

            <div class="card">
              <div class="dropzone" id="dropzone">
                <div class="dropzone-icon">✂️</div>
                <h3 id="dz-title"></h3>
                <p id="dz-sub"></p>
                <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp"/>
                <button class="btn btn-primary mt-4" onclick="document.getElementById('file-input').click()" id="btn-select"></button>
              </div>
            </div>

            <div class="card hidden" id="compare-section">
              <div class="card-title" id="compare-label"></div>
              <div class="compare-grid">
                <div class="compare-box">
                  <img id="original-img" src="" alt="Original"/>
                  <div class="compare-label" id="lbl-original"></div>
                </div>
                <div class="compare-box">
                  <canvas id="result-canvas"></canvas>
                  <div class="compare-label" id="lbl-result"></div>
                </div>
              </div>
            </div>

            <div class="card hidden" id="progress-section">
              <div class="card-title" id="progress-label"></div>
              <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
              <div class="progress-label" id="progress-text"></div>
            </div>

            <div class="card result-area hidden" id="result-section">
              <h3 id="result-title"></h3>
              <p id="result-subtitle"></p>
              <div class="flex gap-2" style="justify-content:center;flex-wrap:wrap;">
                <button class="btn btn-primary btn-lg" id="btn-download-png"></button>
                <button class="btn btn-secondary" id="btn-new"></button>
              </div>
            </div>
          </div>

          <div class="tool-sidebar">
            <div class="card">
              <div class="card-title" data-i18n="ui.options"></div>
              <div class="form-group">
                <label class="form-label" id="lbl-bg-color-label"></label>
                <select class="form-select" id="bg-color">
                  <option value="transparent" id="opt-transparent"></option>
                  <option value="white" id="opt-white"></option>
                  <option value="black" id="opt-black"></option>
                  <option value="custom" id="opt-custom"></option>
                </select>
              </div>
              <div class="form-group hidden" id="custom-color-group">
                <label class="form-label" id="lbl-custom-color"></label>
                <input type="color" id="custom-color" value="#ff0000" style="width:100%;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;"/>
              </div>
              <button class="btn btn-primary w-full" id="btn-remove" disabled></button>
            </div>

            <div style="font-size:.8rem;color:var(--text-secondary);text-align:center;" data-i18n="ui.privacyNote"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="footer-placeholder"></div>

  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.documentElement.lang = window.LANG === 'pt' ? 'pt-BR' : 'en';
    renderPage('..');

    const L = {
      pt: {
        title:'Remover Fundo de Imagem',
        subtitle:'Remova o fundo de qualquer imagem automaticamente com IA. 100% no seu navegador, sem enviar arquivos.',
        dzTitle:'Arraste e solte uma imagem aqui', dzSub:'Suporta JPG, PNG, WebP',
        btnSelect:'Selecionar imagem', btnRemove:'✨ Remover fundo',
        btnDownloadPng:'⬇ Baixar PNG transparente', btnNew:'Nova imagem',
        compareLabel:'Resultado', lblOriginal:'Original', lblResult:'Sem fundo',
        progressLbl:'Processando com IA...', resultTitle:'✅ Fundo removido!',
        resultSub:'Baixe a imagem com fundo transparente (PNG).',
        modelLoading:'Baixando modelo de IA (primeira vez ~40MB, depois fica em cache)...',
        modelDownloading:'Baixando modelo de IA: ',
        modelReady:'✅ Modelo pronto!',
        modelError:'⚠️ Erro ao carregar modelo. Recarregue a página.',
        lblBgColor:'Fundo de visualização', optTransparent:'Transparente',
        optWhite:'Branco', optBlack:'Preto', optCustom:'Cor personalizada',
        lblCustomColor:'Cor de fundo'
      },
      en: {
        title:'Remove Image Background',
        subtitle:'Automatically remove the background from any image with AI. 100% in your browser, no file uploads.',
        dzTitle:'Drag & drop an image here', dzSub:'Supports JPG, PNG, WebP',
        btnSelect:'Select image', btnRemove:'✨ Remove background',
        btnDownloadPng:'⬇ Download transparent PNG', btnNew:'New image',
        compareLabel:'Result', lblOriginal:'Original', lblResult:'No background',
        progressLbl:'Processing with AI...', resultTitle:'✅ Background removed!',
        resultSub:'Download the image with transparent background (PNG).',
        modelLoading:'Downloading AI model (first time ~40MB, then cached)...',
        modelDownloading:'Downloading AI model: ',
        modelReady:'✅ Model ready!',
        modelError:'⚠️ Error loading model. Reload the page.',
        lblBgColor:'Preview background', optTransparent:'Transparent',
        optWhite:'White', optBlack:'Black', optCustom:'Custom color',
        lblCustomColor:'Background color'
      }
    };
    const S = L[window.LANG] || L.pt;

    document.getElementById('title').textContent            = S.title;
    document.getElementById('subtitle').textContent         = S.subtitle;
    document.getElementById('dz-title').textContent         = S.dzTitle;
    document.getElementById('dz-sub').textContent           = S.dzSub;
    document.getElementById('btn-select').textContent       = S.btnSelect;
    document.getElementById('btn-remove').textContent       = S.btnRemove;
    document.getElementById('btn-download-png').textContent = S.btnDownloadPng;
    document.getElementById('btn-new').textContent          = S.btnNew;
    document.getElementById('compare-label').textContent    = S.compareLabel;
    document.getElementById('lbl-original').textContent     = S.lblOriginal;
    document.getElementById('lbl-result').textContent       = S.lblResult;
    document.getElementById('progress-label').textContent   = S.progressLbl;
    document.getElementById('result-title').textContent     = S.resultTitle;
    document.getElementById('result-subtitle').textContent  = S.resultSub;
    document.getElementById('model-notice-text').textContent= S.modelLoading;
    document.getElementById('lbl-bg-color-label').textContent= S.lblBgColor;
    document.getElementById('opt-transparent').textContent  = S.optTransparent;
    document.getElementById('opt-white').textContent        = S.optWhite;
    document.getElementById('opt-black').textContent        = S.optBlack;
    document.getElementById('opt-custom').textContent       = S.optCustom;
    document.getElementById('lbl-custom-color').textContent = S.lblCustomColor;
    document.title = S.title + ' — ConverTaTudo';

    // Background color toggle
    document.getElementById('bg-color').addEventListener('change', function() {
      document.getElementById('custom-color-group').classList.toggle('hidden', this.value !== 'custom');
      if (resultOffscreen) renderResult();
    });
    document.getElementById('custom-color').addEventListener('input', () => {
      if (resultOffscreen) renderResult();
    });

    // State
    let aiModel = null;
    let aiProcessor = null;
    let RawImage = null;
    let currentFile = null;
    let resultOffscreen = null; // canvas with transparent bg (raw AI output)

    // Load @xenova/transformers and the RMBG-1.4 model immediately
    (async () => {
      const noticeEl = document.getElementById('model-notice');
      const noticeTxt = document.getElementById('model-notice-text');
      const modelBar  = document.getElementById('model-bar');

      try {
        // Dynamic ESM import — works without SharedArrayBuffer
        const { AutoModel, AutoProcessor, RawImage: RI, env } = await import(
          'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2'
        );
        RawImage = RI;

        // Force single-threaded WASM to avoid COEP/COOP requirement on GitHub Pages
        env.allowLocalModels = false;
        if (env.backends?.onnx?.wasm) {
          env.backends.onnx.wasm.numThreads = 1;
        }

        let lastPct = 0;
        const progressCb = (data) => {
          if (data.status === 'progress' && data.total > 0) {
            const pct = Math.round(data.progress ?? (data.loaded / data.total * 100));
            if (pct > lastPct) {
              lastPct = pct;
              modelBar.style.width = pct + '%';
              noticeTxt.textContent = S.modelDownloading + pct + '%';
            }
          }
        };

        // Load model + processor in parallel
        [aiModel, aiProcessor] = await Promise.all([
          AutoModel.from_pretrained('briaai/RMBG-1.4', {
            config: { model_type: 'custom' },
            progress_callback: progressCb
          }),
          AutoProcessor.from_pretrained('briaai/RMBG-1.4', {
            config: {
              do_normalize: true,
              do_pad: false,
              do_rescale: true,
              do_resize: true,
              image_mean: [0.5, 0.5, 0.5],
              image_std: [1, 1, 1],
              resample: 2,
              rescale_factor: 0.00392156862745098,
              size: { width: 1024, height: 1024 }
            }
          })
        ]);

        modelBar.style.width = '100%';
        noticeEl.classList.add('success');
        noticeTxt.textContent = S.modelReady;
        setTimeout(() => { noticeEl.style.display = 'none'; }, 2500);

        if (currentFile) document.getElementById('btn-remove').disabled = false;

      } catch (e) {
        console.error('Model load error:', e);
        noticeEl.classList.add('error');
        noticeTxt.textContent = S.modelError;
        modelBar.style.display = 'none';
      }
    })();

    // Dropzone & file input
    initDropzone({
      el: document.getElementById('dropzone'),
      accept: 'image/png,image/jpeg,image/webp',
      multiple: false,
      onFiles: (f) => { if (f[0]) loadFile(f[0]); }
    });
    document.getElementById('file-input').addEventListener('change', function() {
      if (this.files[0]) loadFile(this.files[0]);
      this.value = '';
    });

    function loadFile(file) {
      currentFile = file;
      resultOffscreen = null;
      document.getElementById('original-img').src = URL.createObjectURL(file);
      document.getElementById('compare-section').classList.remove('hidden');
      document.getElementById('result-section').classList.add('hidden');
      // Reset result canvas
      const rc = document.getElementById('result-canvas');
      rc.width = 1; rc.height = 1;
      rc.getContext('2d').clearRect(0,0,1,1);
      if (aiModel && aiProcessor) document.getElementById('btn-remove').disabled = false;
    }

    // Remove background
    document.getElementById('btn-remove').addEventListener('click', async () => {
      if (!currentFile || !aiModel || !aiProcessor || !RawImage) return;

      const bar  = document.getElementById('progress-bar');
      const txt  = document.getElementById('progress-text');
      const prog = document.getElementById('progress-section');

      prog.classList.remove('hidden');
      document.getElementById('result-section').classList.add('hidden');
      document.getElementById('btn-remove').disabled = true;

      // Animate progress bar while AI processes
      let pct = 0;
      bar.style.width = '0%';
      txt.textContent = '0%';
      const ticker = setInterval(() => {
        pct = Math.min(pct + 1, 85);
        bar.style.width = pct + '%';
        txt.textContent = pct + '%';
      }, 80);

      try {
        // Load image as RawImage
        const objUrl = URL.createObjectURL(currentFile);
        const image = await RawImage.fromURL(objUrl);
        URL.revokeObjectURL(objUrl);

        // Inference
        const { pixel_values } = await aiProcessor(image);
        const { output } = await aiModel({ input: pixel_values });

        // Resize mask to original image dimensions
        const mask = await RawImage
          .fromTensor(output[0].mul(255).to('uint8'))
          .resize(image.width, image.height);

        // Build offscreen canvas: draw image then apply alpha mask
        const oc = document.createElement('canvas');
        oc.width  = image.width;
        oc.height = image.height;
        const octx = oc.getContext('2d');
        octx.drawImage(image.toCanvas(), 0, 0);
        const imgData = octx.getImageData(0, 0, oc.width, oc.height);
        for (let i = 0; i < mask.data.length; i++) {
          imgData.data[4 * i + 3] = mask.data[i];
        }
        octx.putImageData(imgData, 0, 0);
        resultOffscreen = oc;

        clearInterval(ticker);
        bar.style.width = '100%';
        txt.textContent = '100%';
        setTimeout(() => prog.classList.add('hidden'), 400);

        // Render to display canvas (with chosen background)
        renderResult();

        document.getElementById('compare-section').classList.remove('hidden');
        document.getElementById('result-section').classList.remove('hidden');
        toast(window.LANG === 'pt' ? 'Fundo removido com sucesso!' : 'Background removed!', 'success');

      } catch (e) {
        clearInterval(ticker);
        prog.classList.add('hidden');
        console.error('Background removal error:', e);
        toast(
          window.LANG === 'pt'
            ? 'Erro ao processar. Tente uma imagem menor ou diferente.'
            : 'Error processing. Try a smaller or different image.',
          'error'
        );
      }

      document.getElementById('btn-remove').disabled = false;
    });

    // Render result canvas with selected background color
    function renderResult() {
      if (!resultOffscreen) return;
      const canvas = document.getElementById('result-canvas');
      canvas.width  = resultOffscreen.width;
      canvas.height = resultOffscreen.height;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const bgVal = document.getElementById('bg-color').value;
      if (bgVal !== 'transparent') {
        ctx.fillStyle = bgVal === 'custom'
          ? document.getElementById('custom-color').value
          : bgVal;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.drawImage(resultOffscreen, 0, 0);
    }

    // Download — always transparent PNG from the offscreen canvas
    document.getElementById('btn-download-png').addEventListener('click', () => {
      if (!resultOffscreen) return;
      resultOffscreen.toBlob(
        blob => downloadBlob(blob, fileBaseName(currentFile.name) + '_sem_fundo.png'),
        'image/png'
      );
    });

    // New image
    document.getElementById('btn-new').addEventListener('click', () => {
      currentFile = null;
      resultOffscreen = null;
      document.getElementById('compare-section').classList.add('hidden');
      document.getElementById('result-section').classList.add('hidden');
      document.getElementById('btn-remove').disabled = true;
    });
  </script>
</body>
</html>
